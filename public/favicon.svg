<!-- public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4c51bf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5a3d7c;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" fill="url(#gradient)"/>
  
  <!-- Inner geometric pattern -->
  <rect x="15" y="15" width="70" height="70" rx="12" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Letter M -->
  <text x="50" y="68" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-size="52" font-weight="bold" fill="white" text-anchor="middle" 
        dominant-baseline="middle" filter="url(#glow)">
    M
  </text>
  
  <!-- Decorative dots -->
  <circle cx="25" cy="25" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="75" cy="75" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="25" cy="75" r="2" fill="rgba(255,255,255,0.2)"/>
  <circle cx="75" cy="25" r="2" fill="rgba(255,255,255,0.2)"/>
</svg>